id: rbkd-smb-default-credentials

info:
  name: SMB - Factory Default Credentials
  author: rbkd
  severity: high
  description: |
    Attempts a small set of factory-default SMB credentials (administrator/admin
    against classic passwords). Dictionary brute lives in fscan behind Brute.
  metadata:
    max-request: 8
    shodan-query: "port:445"
  tags: js,network,smb,default-login,vuln

javascript:
  - pre-condition: |
      isPortOpen(Host,Port);
    code: |
      var m = require("nuclei/smb");
      var c = new m.SMBClient();
      var response = c.ListShares(Host, Port, User, Pass);
      response;

    args:
      Host: "{{Host}}"
      Port: "445"
      User: "{{usernames}}"
      Pass: "{{passwords}}"

    attack: clusterbomb
    payloads:
      usernames:
        - 'administrator'
        - 'admin'
      passwords:
        - '123456'
        - 'admin'
        - 'P@ssw0rd'
        - 'password'

    stop-at-first-match: true
    matchers:
      - type: dsl
        dsl:
          - 'response != "[]"'
          - 'success == true'
        condition: and
