id: rbkd-ldap-default-credentials

info:
  name: LDAP - Factory Default Credentials
  author: rbkd
  severity: high
  description: |
    Attempts the classic LDAP factory default admin/admin.
  metadata:
    verified: true
    shodan-query: ldap
  tags: js,ldap,default-login,network,vuln

javascript:
  - code: |
      let ldap = require('nuclei/ldap');
      let cfg = new ldap.Config();
      cfg.Upgrade = true;
      let client = ldap.Client(Host, Port, cfg);
      client.Authenticate(User, Pass);
      let metadata = client.CollectMetadata();
      Export((metadata));

    args:
      Host: "ldap://{{Host}}"
      Port: 389
      User: "{{usernames}}"
      Pass: "{{passwords}}"

    attack: clusterbomb
    payloads:
      usernames:
        - admin
      passwords:
        - admin

    stop-at-first-match: true
    matchers:
      - type: dsl
        dsl:
          - 'success == true'
          - 'len(resp) != 0'

    extractors:
      - type: dsl
        internal: true
        name: resp
        dsl:
          - response
