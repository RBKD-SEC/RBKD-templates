id: rbkd-postgres-default-credentials

info:
  name: Postgres - Factory Default Credentials
  author: rbkd
  severity: high
  description: |
    Attempts a small set of classic Postgres factory defaults (at most six
    combinations). Dictionary brute is out of scope for this channel.
  metadata:
    max-request: 6
    shodan-query: port:5432
  tags: js,postgresql,default-login,network,vuln

javascript:
  - pre-condition: |
      var m = require("nuclei/postgres");
      var c = m.PGClient();
      c.IsPostgres(Host, Port);
    code: |
      var m = require("nuclei/postgres");
      var c = m.PGClient();
      c.Connect(Host, Port, User, Pass);
    args:
      Host: "{{Host}}"
      Port: "5432"
      User: "{{usernames}}"
      Pass: "{{passwords}}"
    attack: clusterbomb
    payloads:
      usernames:
        - "postgres"
        - "admin"
      passwords:
        - "postgres"
        - "admin"
        - "password"
    stop-at-first-match: true
    matchers:
      - type: dsl
        dsl:
          - "response == true"
          - "success == true"
        condition: and
