id: afalg-race-lpe-version

info:
  name: Linux Kernel AF_ALG Concurrent Write Race LPE - Version Candidate (CVE-2025-39964)
  author: anchorscan
  severity: medium
  description: >
    CVE-2025-39964：Linux 内核 AF_ALG（内核 crypto 用户态 API）并发写竞态本地
    提权。同一 AF_ALG socket 并发 sendmsg 导致数据不可预测交错与 socket 内部
    状态不一致，可构造任意内核写，非特权本地用户提权到 root。CVSS 7.8
    AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H；CISA KEV 2026-09-18 收录（在野利用）。
    前置：本地非特权代码执行 + CONFIG_CRYPTO_USER_API 系列启用（主流发行版
    默认启用），非远程漏洞。引入 commit 8ff590903d5f（algif_skcipher 接口，
    mainline v2.6.38，2010 年；fix commits 的 Fixes: 行锚定）；修复
    （af_alg_sendmsg 独占写所有权，新增 ctx->write）：5.10.245 / 5.15.194 /
    6.1.154 / 6.6.108 / 6.12.49 / 6.16.9，6.17+ 含 mainline 修复 1b34cbbf4f01；
    中间 EOL 分支（5.11-5.14 / 5.16-6.0 / 6.2-6.5 / 6.7-6.11 / 6.13-6.15）
    无 stable 修复，均在受影响区间。本模板本地执行 uname -r、剥离发行版后缀
    （-generic / -0ubuntu1xx / .x86_64 等，按「版本号后紧跟 - 或行尾」语义）
    后对照受影响区间判定——版本号只是候选证据，不能冒充漏洞确认（Playbook
    ADR-0001 口径）：命中仅说明内核版本落在受影响区间，实际可利用性需攻击者
    已具备本地低权限执行前提，且发行版 backport 修复不改版本号亦可致误报
    （老 LTS 发行版可能已 backport 该修复而版本号不变）；落地后确证走人工
    复核（postex：核对 /proc/config.gz 的 CONFIG_CRYPTO_USER_API*、发行版
    changelog 是否 backport）。【版本匹配型声明】本 POC 为版本匹配型验证，
    命中仅说明版本落在受影响区间，不能冒充漏洞确认，可能存在误报（发行版
    backport 不改版本号亦可致误报）；手册条目（cve-2025-39964-afalg-lpe）
    含同款说明。【运行要求】nuclei 对 code 协议模板默认禁用，须加 -code 参数
    运行。【验证形态】verified=false：模板逻辑经 fixture 版本集门禁全链验证
    （scripts/verify-afalg-race-lpe-version.sh：PATH shim 注入 fake uname +
    真实 nuclei -code 引擎，24 正例 / 12 负例），无真实内核靶标（Docker 共享
    宿主内核无法构造，武器化 brief §2.4 裁定不建 lab）。【EXP 参考（外部来源，
    未逐文件验证，本仓不内嵌代码）】kernelCTF writeup
    https://sit-cybersecurity.com/af-alg-linux-lpe/ 与 EXP 仓库
    https://github.com/n1k0oowang/CVE-2025-39964_EXP 。
  reference:
    - https://nvd.nist.gov/vuln/detail/CVE-2025-39964
    - https://www.cisa.gov/known-exploited-vulnerabilities-catalog
    - https://git.kernel.org/stable/c/1b34cbbf4f011a121ef7b2d7d6e6920a036d5285
    - https://git.kernel.org/stable/c/0f28c4adbc4a97437874c9b669fd7958a8c6d6ce
    - https://api.osv.dev/v1/vulns/CVE-2025-39964
    - https://sit-cybersecurity.com/af-alg-linux-lpe/
    - https://github.com/n1k0oowang/CVE-2025-39964_EXP
  remediation: >
    升级到各 stable 分支修复版及以上：5.10.245+ / 5.15.194+ / 6.1.154+ /
    6.6.108+ / 6.12.49+ / 6.16.9+（6.17+ 含 mainline 修复）；EOL 分支
    （2.6.38-4.x / 5.0-5.9 / 5.11-5.14 / 5.16-6.0 / 6.2-6.5 / 6.7-6.11 /
    6.13-6.15）无 stable 修复，需升级到受支持分支。缓解：限制本地非特权代码
    执行面；不需要内核 crypto 用户态 API 的系统可关闭 CONFIG_CRYPTO_USER_API
    系列选项后重构内核。
  classification:
    cve-id: CVE-2025-39964
    cpe: cpe:2.3:o:linux:linux_kernel:*:*:*:*:*:*:*:*
  metadata:
    verified: false
    max-request: 1
    vendor: linux
    product: linux_kernel
  tags: anchorscan,cve,cve2025,linux,kernel,lpe,afalg,version

code:
  - engine:
      - sh
    source: |
      uname -r

    # 版本候选判定：uname -r 输出剥发行版后缀（版本号后紧跟 - 或行尾）后，
    # 落在受影响区间 [2.6.38, 各分支修复版) 即命中。本机 nuclei v3.11.1 无
    # compareVersions DSL，区间用 RE2 正则直接表达；RE2 无先行断言，故逐分支
    # 枚举 Z 段（fix<245 -> [0-9]|[1-9][0-9]|1[0-9]{2}|2[0-3][0-9]|24[0-4] 形态）。
    # 分支清单：2.6.38-2.6.99 / 3.x / 4.x / 5.0-5.9 / 5.10.Z<245 / 5.11-5.14 /
    # 5.15.Z<194 / 5.16-5.19 / 6.0 / 6.1.Z<154 / 6.2-6.5 / 6.6.Z<108 / 6.7-6.11 /
    # 6.12.Z<49 / 6.13-6.15 / 6.16.Z<9；各分支修复版及以上、6.17+、2.6.37 及
    # 以下不命中。行尾边界用 \s*$ 吸收命令输出尾换行。
    matchers:
      - type: regex
        regex:
          - '^2\.6\.(?:3[8-9]|[4-9][0-9])(?:-|\s*$)'
          - '^3\.[0-9]+\.[0-9]+(?:-|\s*$)'
          - '^4\.[0-9]+\.[0-9]+(?:-|\s*$)'
          - '^5\.[0-9]\.[0-9]+(?:-|\s*$)'
          - '^5\.10\.(?:[0-9]|[1-9][0-9]|1[0-9]{2}|2[0-3][0-9]|24[0-4])(?:-|\s*$)'
          - '^5\.1[1-4]\.[0-9]+(?:-|\s*$)'
          - '^5\.15\.(?:[0-9]|[1-9][0-9]|1[0-8][0-9]|19[0-3])(?:-|\s*$)'
          - '^5\.1[6-9]\.[0-9]+(?:-|\s*$)'
          - '^6\.0\.[0-9]+(?:-|\s*$)'
          - '^6\.1\.(?:[0-9]|[1-9][0-9]|1[0-4][0-9]|15[0-3])(?:-|\s*$)'
          - '^6\.[2-5]\.[0-9]+(?:-|\s*$)'
          - '^6\.6\.(?:[0-9]|[1-9][0-9]|10[0-7])(?:-|\s*$)'
          - '^6\.(?:[7-9]|1[01])\.[0-9]+(?:-|\s*$)'
          - '^6\.12\.(?:[0-9]|[1-3][0-9]|4[0-8])(?:-|\s*$)'
          - '^6\.1[3-5]\.[0-9]+(?:-|\s*$)'
          - '^6\.16\.[0-8](?:-|\s*$)'

    extractors:
      - name: kernel_release
        type: regex
        group: 1
        regex:
          - '^([0-9]+\.[0-9]+\.[0-9]+)'
