id: thinkphp-detect

info:
  name: ThinkPHP - Detect (Enhanced)
  author: RBKD-SEC
  severity: info
  description: |
    Detects the ThinkPHP PHP framework and extracts its disclosed version.
  classification:
    cpe: cpe:2.3:a:thinkphp:thinkphp:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 2
    fofa-query: app="ThinkPHP"
    shodan-query: title:"ThinkPHP"
  reference:
    - https://www.thinkphp.cn
  tags: thinkphp,tech,detect,discovery

  # 相比官方 nuclei-templates/http/technologies/thinkphp-detect.yaml 的增强点：
  #   1. 新增 /index.php?m=1 版本泄露页请求 —— 官方只请求首页与一个随机模块路径。
  #   2. 新增版本 extractor：从页脚 "ThinkPHP</a><sup>x.y.z</sup>" 提取版本号 —— 官方无任何版本提取能力。
  #   3. 新增 "ThinkPHP</a><sup>" 这一特异性 body 标记。
  #   保留官方的 X-Powered-By: ThinkPHP 响应头与 /Library/Think/、/thinkphp/library/think/ body 标记。

http:
  - method: GET
    path:
      - "{{BaseURL}}/"
      - "{{BaseURL}}/index.php?m=1"

    stop-at-first-match: false

    matchers-condition: or
    matchers:
      - type: word
        part: header
        words:
          - "x-powered-by: ThinkPHP"
        case-insensitive: true

      - type: word
        part: body
        words:
          - "/Library/Think/"
          - "/thinkphp/library/think/"
          - "ThinkPHP</a><sup>"
        condition: or

    extractors:
      - type: regex
        part: body
        name: version
        group: 1
        regex:
          - 'ThinkPHP</a><sup>([0-9.]+)</sup>'
