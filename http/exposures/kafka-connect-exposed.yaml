id: kafka-connect-exposed

info:
  name: Apache Kafka Connect REST API Unauthenticated Access
  author: internal
  severity: medium
  description: |
    Detects an Apache Kafka Connect REST API that allows unauthenticated
    connector enumeration. Two-stage evidence on the same host: the worker
    root exposes the Connect fingerprint (version, commit, kafka_cluster_id)
    and /connectors returns a JSON array without authentication. An empty
    array still indicates an accessible API on a worker with no connectors
    configured. Enumeration only, not an RCE finding.
  metadata:
    verified: true
    max-request: 2
  tags: http,exposure,kafka,kafka-connect

  # 官方仅有 exposed-panels/kafka-connect-ui.yaml（UI 面板 <title>）与漏洞利用类
  #   CVE 模板（如 CVE-2023-25194），均未覆盖 Kafka Connect REST API 本体的未授权
  #   枚举检测，本模板为有效补充。
  #   两阶段证据链（nuclei v3.11 多请求为逐请求独立评估，中间 matcher 既不构成
  #   AND 也不会中止链，故指纹证据经 internal extractor 变量传递，由 Stage 2 的
  #   DSL 断言完成 AND）：
  #   1) GET / 提取 Connect 根响应稳定字段 version/commit/kafka_cluster_id
  #      （证明是 Kafka Connect worker）；
  #   2) GET /connectors 须为 200 JSON 且根值为 array，且 1) 的三个变量全部
  #      提取成功（证明枚举接口无需认证，空数组 [] 亦视为暴露）。
  #   变量未提取时 nuclei 可能保留 {{...}} 字面量或展开为空串，contains('{{')
  #   检查对两种实现均判 false，防止提取失败被误判为成功。
  #   反例防护：root 可识别但 /connectors 401/403、/connectors 返回 JSON
  #   object/字符串/畸形 JSON、普通 200 []、HTML 含方括号、其他产品同名路由
  #   均不命中。stop-at-first-match 有第一阶段命中即中止的风险，多请求下不使用。

http:
  # Stage 1: 识别 Kafka Connect worker，提取根响应三稳定字段为内部变量
  - method: GET
    path:
      - "{{BaseURL}}/"
    extractors:
      - type: regex
        name: kc_version
        internal: true
        part: body
        group: 1
        regex:
          - '"version"\s*:\s*"([^"]+)"'

      - type: regex
        name: kc_commit
        internal: true
        part: body
        group: 1
        regex:
          - '"commit"\s*:\s*"([^"]+)"'

      - type: regex
        name: kc_cluster_id
        internal: true
        part: body
        group: 1
        regex:
          - '"kafka_cluster_id"\s*:\s*"([^"]+)"'

  # Stage 2: 确认 /connectors 未授权枚举（200 + JSON + 根值 array），
  # 且 Stage 1 三个指纹变量全部提取成功（同 BaseURL 两阶段 AND）
  - method: GET
    path:
      - "{{BaseURL}}/connectors"
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        part: header
        words:
          - 'application/json'

      - type: regex
        part: body
        regex:
          - '^\s*\['
          - '\]\s*$'
        condition: and

      - type: dsl
        condition: and
        dsl:
          - "len('{{kc_version}}') > 0 && !contains('{{kc_version}}', '{{')"
          - "len('{{kc_commit}}') > 0 && !contains('{{kc_commit}}', '{{')"
          - "len('{{kc_cluster_id}}') > 0 && !contains('{{kc_cluster_id}}', '{{')"
